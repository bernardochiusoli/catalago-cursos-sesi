name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build backend/Catalogo.Api/Catalogo.Api.csproj -c Release
      - run: dotnet test backend/Catalogo.Api.Tests/Catalogo.Api.Tests.csproj -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t catalogo-cursos-sesi .

  # Gera o ZIP de publicação (API publicada + front compilado + scripts do banco).
  # Baixe em Actions > execução > Artifacts > catalogo-publicacao.
  publicacao:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/gerar-publicacao.sh
      - uses: actions/upload-artifact@v4
        with:
          name: catalogo-publicacao
          path: publicacao/catalogo-publicacao.zip
