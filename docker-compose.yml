# Execução local completa: banco PostgreSQL + aplicação (front + API).
#   docker compose up --build
#   Aplicação: http://localhost:8080   Documentação da API: http://localhost:8080/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogo"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=catalogo;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
